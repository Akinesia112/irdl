name: 'Smoke Tests'
description: 'Run Smoke Tests'
inputs:
  command:
    description: 'The uv command to invoke the smoke tests.'
    required: true
runs:
  using: composite
  steps:
    - name: Test Import
      run: ${{ inputs.command }} python -c "import irdl"
      shell: bash -e {0}
    - name: Check CLI
      shell: bash -e {0}
      run: |
        ${{ inputs.command }} irdl --help
        ${{ inputs.command }} irdl cache --help
        ${{ inputs.command }} irdl list
        ${{ inputs.command }} irdl get --help
        ${{ inputs.command }} irdl get miracle --help
