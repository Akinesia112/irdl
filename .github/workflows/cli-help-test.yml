name: CLI Help Test
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-help-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Test CLI help consistency
        run: |
          # Get the actual CLI help output from the current code
          # Disable colors and set fixed width for consistent output
          export NO_COLOR=1
          export COLUMNS=120
          ACTUAL_HELP=$(uv run irdl --help 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          
          # Extract the CLI help section from README.md
          # Look for the code block containing "Usage: irdl"
          IN_BLOCK=0
          FOUND_CLI=0
          README_HELP=""
          
          while IFS= read -r line; do
            # Check if we're entering a shell code block
            if [[ "$line" == *'```'" shell"* ]] || [[ "$line" == *'```'"shell"* ]]; then
              IN_BLOCK=1
              FOUND_CLI=0
              continue
            fi
            
            # If we're in a block, check if this line indicates it's CLI help
            if [ "$IN_BLOCK" -eq 1 ] && [ "$FOUND_CLI" -eq 0 ]; then
              if [[ "$line" == *'Usage: irdl'* ]] || [[ "$line" == *'irdl --help'* ]]; then
                FOUND_CLI=1
              fi
            fi
            
            # Check if we're exiting a code block
            if [[ "$line" == *'```'* ]] && [ "$IN_BLOCK" -eq 1 ]; then
              IN_BLOCK=0
              # Only keep the content if we found CLI help
              if [ "$FOUND_CLI" -eq 0 ]; then
                README_HELP=""
              else
                break
              fi
            fi
            
            # If we're in a shell block and found CLI help, capture the line
            if [ "$IN_BLOCK" -eq 1 ] && [ "$FOUND_CLI" -eq 1 ]; then
              README_HELP+="$line"$'\n'
            fi
          done < README.md
          
          # Remove the "$ irdl --help" line if present
          README_HELP=$(echo "$README_HELP" | sed '/^\$ irdl --help$/d')
          
          # Compare the two outputs
          if [ "$README_HELP" != "$ACTUAL_HELP" ]; then
            echo "ERROR: README.md CLI help does not match 'uv run irdl --help' output!"
            echo ""
            echo "=== README.md CLI help ==="
            echo "$README_HELP"
            echo ""
            echo "=== Actual 'uv run irdl --help' output ==="
            echo "$ACTUAL_HELP"
            exit 1
          fi
          
          echo "OK: README.md CLI help matches 'uv run irdl --help' output."
